<!doctype html>
<html>
  <head>
    <title>student</title>
  </head>

  <body>
    <h1>CCSIT Co-op Registration Form</h1>
    <p>
      This form is required to be completed by all students planning to take
      Co-op Training in the Summer for 2019
    </p>
    <form action="">
      <fieldset>
        <legend>Student Information</legend>
        <table border="0">
          <tr>
            <td><label for="name">full name*</label></td>
            <td><input type="text" /></td>
          </tr>
          <tr>
            <td><label for="gen">Gender</label></td>
            <td>
              <input type="radio" name="Gender" value="M" /> male
              <input type="radio" name="Gender" value="F" /> female
            </td>
          </tr>
          <tr>
            <td><label for="year of study">year of study</label></td>
            <td>
              1<input type="range" name="ystudy" min="1" max="4" step="1" />4
            </td>
          </tr>
        </table>
      </fieldset>
    </form>
  </body>
</html>
